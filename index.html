<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f0">
  <title>Palfor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono-192.png">
  <link rel="apple-touch-icon" href="iconos/icono-192.png">
  <link rel="stylesheet" href="estilos.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <header class="barra">
    <h1 class="marca"><img class="marca-icono" src="iconos/logo-orquidea.png" alt="" width="40" height="36"><span>Vivero <b>Palfor</b></span></h1>
    <button id="instalar" class="boton-claro instalar" type="button" hidden>Instalar app</button>
    <p id="conexion" class="conexion" role="status"></p>
  </header>

  <main>
    <div id="aviso-respaldo" class="aviso aviso-respaldo" role="alert" hidden>
      <span></span><button id="aviso-guardar" class="boton-claro" type="button">Guardar respaldo ahora</button>
    </div>
    <section id="inventario" class="vista" aria-label="Inventario">
      <div id="aviso-agotadas" class="aviso" hidden></div>
      <div class="encabezado">
        <div><p class="eyebrow">PLANTAS</p><h2>Inventario</h2></div>
        <button id="nueva" class="boton" type="button">+ Agregar planta</button>
      </div>
      <div id="resumen" class="resumen" role="status"></div>
      <div class="fila">
        <label class="busqueda"><span aria-hidden="true">⌕</span><input id="buscar" type="search" placeholder="Buscar planta, lote o ubicación…" aria-label="Buscar" autocomplete="off"></label>
        <label class="campo-corto">Ver
          <select id="agrupar"><option value="">Lista</option><option value="ubicacion">Por ubicación</option><option value="categoria">Por categoría</option></select>
        </label>
      </div>
      <div id="lista" class="lista"></div>
      <div class="fila respaldo">
        <button id="exportar" class="boton-claro" type="button">Guardar respaldo</button>
        <button id="compartir" class="boton-claro" type="button" hidden>Enviar respaldo (Drive, WhatsApp…)</button>
        <label class="boton-claro">Restaurar respaldo<input id="importar" type="file" accept="application/json,.json" hidden></label>
      </div>
      <p id="estado" class="estado" role="status" aria-live="polite"></p>
      <p id="proteccion" class="nota"></p>
    </section>

    <section id="pedidos" class="vista" aria-label="Pedidos" hidden>
      <div class="encabezado">
        <div><p class="eyebrow">CLIENTES</p><h2>Pedidos</h2></div>
        <button id="nuevo-pedido" class="boton" type="button">+ Nuevo pedido</button>
      </div>
      <p id="pedidos-estado" class="estado" role="status" aria-live="polite"></p>
      <label class="campo-corto">Ver
        <select id="filtro-pedidos"><option value="pendiente">Pendientes</option><option value="entregado">Entregados</option><option value="cancelado">Cancelados</option><option value="">Todos</option></select>
      </label>
      <div id="lista-pedidos" class="lista"></div>
    </section>

    <section id="clima" class="vista" aria-label="Clima" hidden>
      <div class="encabezado"><div><p class="eyebrow">TAPACHULA, CHIAPAS</p><h2>Clima del vivero.</h2></div><button id="actualizar-clima" class="boton" type="button">Actualizar ↻</button></div>
      <p id="clima-estado" class="estado" role="status"></p>
      <p id="clima-consejo" class="aviso" hidden></p>
      <div id="clima-ahora" class="rejilla"></div>
      <h3>Próximos cinco días</h3>
      <div id="clima-dias" class="rejilla dias"></div>
      <p class="nota">Datos: <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>. Sin internet se muestra el último pronóstico guardado.</p>
    </section>

    <section id="calculadora" class="vista" aria-label="Calculadora" hidden>
      <div class="encabezado"><div><p class="eyebrow">CUENTAS</p><h2>Calculadora.</h2></div></div>
      <div class="calc">
        <p id="calc-operacion" class="calc-operacion" aria-hidden="true"></p>
        <output id="calc-pantalla" class="calc-pantalla" aria-live="polite">0</output>
        <div id="calc-teclas" class="calc-teclas"></div>
      </div>
    </section>
  </main>

  <nav class="pestanas" aria-label="Secciones">
    <button type="button" data-vista="inventario" aria-current="page">🌱<span>Inventario</span></button>
    <button type="button" data-vista="pedidos">📋<span>Pedidos</span></button>
    <button type="button" data-vista="clima">☀<span>Clima</span></button>
    <button type="button" data-vista="calculadora">＋<span>Cuentas</span></button>
  </nav>

  <dialog id="formulario">
    <form id="planta" method="dialog">
      <h2 id="form-titulo">Planta</h2>
      <input name="id" type="hidden">
      <div id="zona-foto" class="zona-foto" tabindex="0">
        <img id="foto-previa" alt="" hidden>
        <p id="foto-texto">Arrastra una foto aquí o toca para elegir / tomar una</p>
        <input id="foto" type="file" accept="image/*" hidden>
      </div>
      <label>Nombre común<input name="nombre" required maxlength="100"></label>
      <label>Nombre científico<input name="cientifico" maxlength="100"></label>
      <label>Categoría
        <select name="categoria"><option value="frutal">Frutal</option><option value="maderable">Maderable</option><option value="ornato">Ornato</option><option value="palmera">Palmera</option><option value="otra">Otra</option></select>
      </label>
      <div class="dos">
        <label>Precio (MXN)<input name="precio" type="number" inputmode="decimal" min="0" step="0.01" value="0" required></label>
        <label>Costo (MXN)<input name="costo" type="number" inputmode="decimal" min="0" step="0.01" value="0" required></label>
      </div>
      <label>Existencias<input name="existencias" type="number" inputmode="numeric" min="0" step="1" value="0" required></label>
      <div class="dos">
        <label>Lote<input name="lote" maxlength="40"></label>
        <label>Ubicación<input name="ubicacion" maxlength="50" placeholder="Zona, pasillo, mesa"></label>
      </div>
      <label>Notas<textarea name="notas" rows="3" maxlength="2000"></textarea></label>
      <p id="form-error" class="estado error" role="alert"></p>
      <div class="fila">
        <button class="boton" type="submit">Guardar</button>
        <button id="cancelar" class="boton-claro" type="button">Cancelar</button>
      </div>
    </form>
  </dialog>

  <dialog id="form-pedido">
    <form id="pedido" method="dialog">
      <h2 id="pedido-titulo">Nuevo pedido</h2>
      <label>Cliente<input name="cliente" required maxlength="80" autocomplete="off"></label>
      <div id="lineas" class="lineas"></div>
      <button id="otra-linea" class="boton-claro" type="button">+ Agregar otra planta</button>
      <label>Estado
        <select name="estado"><option value="pendiente">Pendiente</option><option value="entregado">Entregado</option><option value="cancelado">Cancelado (devuelve el stock)</option></select>
      </label>
      <label>Notas<textarea name="notas" rows="2" maxlength="500"></textarea></label>
      <p id="pedido-error" class="estado error" role="alert"></p>
      <div class="fila">
        <button class="boton" type="submit">Guardar</button>
        <button id="pedido-cerrar" class="boton-claro" type="button">Cerrar</button>
        <button id="pedido-borrar" class="boton-claro peligro" type="button" hidden>Borrar pedido</button>
      </div>
    </form>
  </dialog>
</body>
</html>
